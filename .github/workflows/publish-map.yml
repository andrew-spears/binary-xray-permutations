name: Publish map
# Publishes the map/ folder, and nothing else in the repository, to GitHub Pages.
# Steps and the address of the site: docs/claims-map-guide.md, section 7.
on:
  push:
    branches: [main]
    paths: ["map/**", ".github/workflows/publish-map.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: map
      - id: deploy
        uses: actions/deploy-pages@v4
