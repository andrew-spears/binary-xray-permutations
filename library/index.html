<!DOCTYPE html>

<title>Block-building experiments</title>
<style>
:root{--bg:#fbfaf7;--ink:#1d1d1f;--ink2:#6b6b70;--line:#e2dfd8;--chip:#efece6;--acc:#534AB7;--warn:#BA7517}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--ink:#ececee;--ink2:#9a9aa2;--line:#33333a;--chip:#26262b;--acc:#AFA9EC;--warn:#EF9F27}}

.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}

.card:hover{border-color:var(--ink2)}.card .t{font-weight:600}.card .s{color:var(--ink2);font-size:13.5px;margin:2px 0 6px}

.back{border:0;background:none;color:var(--ink2);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-bottom:8px}
.long{font-size:14.5px;margin:4px 0 12px}

.nav{display:flex;align-items:center;gap:12px;margin:6px 0 12px}.nav button{border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}.nav .v{font-weight:600;min-width:120px;text-align:center}
.grid{display:flex;flex-wrap:wrap;gap:14px}.item{text-align:center;width:min(150px,44vw)}.item svg{display:block;margin:0 auto}
.cap{font-size:11.5px;color:var(--ink2);font-family:ui-monospace,Menlo,monospace;margin-top:3px;word-break:break-word}.cap b{color:var(--ink);font-weight:500}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:0 6px;margin-top:2px;background:var(--chip);color:var(--ink2)}.tag.w{color:var(--warn)}
.empty{color:var(--ink2);font-size:14px}
.plank{display:block;margin:6px auto 0;touch-action:manipulation}.stat{text-align:center;font-size:13.5px;color:var(--ink2);min-height:20px;margin:6px 0}
.go{border:0;background:var(--ink);color:var(--bg);border-radius:18px;height:34px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}.go:disabled{opacity:.35}
.small{border:0;background:var(--chip);color:var(--ink);border-radius:16px;height:32px;padding:0 12px;font-size:13px;cursor:pointer}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:12px}.step{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:10px}.step .txt{font-size:13.5px}.step .txt b{font-weight:600}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
</style></head><body><main id="app"></main>

 (function rec(i){if(out.length>=limit)return;if(i===n){out.push(p.slice());return}for(let c=1;c<=n;c++){const d=c-(i+1);if(!used[c]&&S.has(d)&&!ud.has(d)){used[c]=true;ud.add(d);p.push(c);rec(i+1);p.pop();used[c]=false;ud.delete(d)}}})(0);return out}
const norm=a=>{const o=[...a].sort((x,y)=>x-y);return a.map(v=>o.indexOf(v)+1)};
function decompose(p){const n=p.length;for(let k=1;k<n;k++){const a=p.slice(0,k),mx=Math.max(...a),mn=Math.min(...a);
  if(mn===1&&mx===k)return{f:[1,2],segs:[[0,k-1],[k,n-1]]};if(mx===n&&mn===n-k+1)return{f:[2,1],segs:[[0,k-1],[k,n-1]]}}
 const iv=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=p.slice(i,j+1);if(Math.max(...a)-Math.min(...a)===j-i&&j-i<n-1)iv.push([i,j])}
 const mx=iv.filter(b=>!iv.some(c=>c!==b&&c[0]<=b[0]&&b[1]<=c[1]));const segs=[];for(let i=0;i<n;){const b=mx.find(b=>b[0]===i);if(b){segs.push(b);i=b[1]+1}else{segs.push([i,i]);i++}}
 return{f:norm(segs.map(([a,b])=>Math.min(...p.slice(a,b+1)))),segs}}
const memo=new Map();let FMODE="sym";
const isInv=p=>p.every((c,i)=>p[c-1]===i+1),isCs=p=>p.every((c,i)=>p[p.length-1-i]===p.length+1-c),isBin=p=>new Set(p.map((c,i)=>c-i)).size===p.length;
function tree(p){const key=p.join(",");if(memo.has(key))return memo.get(key);let t=null;
 if(p.length===1)t={leaf:true};else{const {f,segs}=decompose(p);const fk=f.join(",");
  const ok=fk==="1,2"||fk==="2,1"||(FMODE==="sym"?(f.length===p.length&&isBin(p)&&(isInv(p)||isCs(p))):FRAMES.has(fk))||(f.length===p.length&&isPn([...p.map((c,i)=>c-i-1)].sort((a,b)=>a-b))&&fk===pnWit(p.length).join(","));
  if(ok){const kids=segs.map(([a,b])=>tree(norm(p.slice(a,b+1))));if(kids.every(k=>k))t={f,kids}}}
 memo.set(key,t);return t}
function materialize(node,open){
 const spans=new Map(),cells=[];
 const sz=nd=>(nd.leaf||!open.has(nd))?1:nd.kids.reduce((a,k)=>a+sz(k),0);
 function go(nd,r0,c0){ if(nd.leaf||!open.has(nd)){cells.push([r0,c0]);spans.set(nd,{r:r0,c:c0,w:1});return 1}
  const ws=nd.kids.map(sz),colOrder=nd.f.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),cst=[];let c=c0;
  for(const i of colOrder){cst[i]=c;c+=ws[i]} let r=r0; nd.kids.forEach((k,i)=>{go(k,r,cst[i]);r+=ws[i]});
  const W=ws.reduce((a,b)=>a+b,0);spans.set(nd,{r:r0,c:c0,w:W});return W}
 go(node,0,0);const perm=Array(cells.length);cells.forEach(([r,c])=>perm[r]=c+1);return{perm,spans}}
const B={n:6,stones:new Set([-3,-2,-1,0,2,4])};
function bsvg(p,hi,cell){const n=p.length;cell=cell||Math.max(10,Math.min(18,Math.floor(170/n)));const S=n*cell+2,d=p.map((c,i)=>c-i-1),rep=d.map(x=>d.filter(y=>y===x).length>1);
 let o=`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><rect x="1" y="1" width="${n*cell}" height="${n*cell}" fill="none" stroke="var(--ink2)" stroke-width="0.6"/>`;
 for(let k=1;k<n;k++)o+=`<path d="M${1+k*cell} 1V${1+n*cell}M1 ${1+k*cell}H${1+n*cell}" stroke="var(--line)" stroke-width="0.6"/>`;
 if(hi)o+=`<rect x="${1+hi.c*cell}" y="${1+hi.r*cell}" width="${hi.w*cell}" height="${hi.w*cell}" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-dasharray="3 2"/>`;
 p.forEach((c,i)=>o+=`<circle cx="${1+(c-.5)*cell}" cy="${1+(i+.5)*cell}" r="${cell*.28}" fill="${rep[i]?'var(--warn)':'var(--ink)'}"/>`);return o+"</svg>"}
function builder(){location.hash="build";const n=B.n,m=2*n-1,w=Math.min(36,340/m),W=w*m+10;
 const D=[...B.stones].sort((a,b)=>a-b);let st={ok:false,msg:`${D.length} of ${n} stones`};if(D.length===n){const L=landauS(D);st=L.ok?{ok:true,msg:"Landau holds"}:L}
 let pl=`<svg class="plank" width="${W}" height="70" viewBox="0 0 ${W} 70"><line x1="5" y1="40" x2="${W-5}" y2="40" stroke="var(--ink2)" stroke-width="3" stroke-linecap="round"/>`;
 for(let k=0;k<m;k++){const d=k-(n-1),x=5+w*(k+.5),on=B.stones.has(d);pl+=`<g data-d="${d}" style="cursor:pointer"><rect x="${x-w/2}" y="0" width="${w}" height="70" fill="transparent"/><text x="${x}" y="62" text-anchor="middle" font-size="${Math.min(12,w*.55)}" fill="var(--ink2)">${d>0?"+":""}${d}</text>`+(on?`<circle cx="${x}" cy="${40-w*.36}" r="${w*.36}" fill="#6f747c"/>`:`<circle cx="${x}" cy="${40-w*.3}" r="${w*.22}" fill="none" stroke="var(--line)" stroke-dasharray="2 2"/>`)+`</g>`}
 pl+="</svg>";
 $("app").innerHTML=`<button class="back" id="bk">‹ all experiments</button><h2>Build an arrangement from the frame set</h2><p class="long">Pick a frame set, then tap marks to place n stones. Symmetric frames: 12, 21 and every block-free solution that folds across the diagonal or survives a half turn. Greedy: the 23 frames from the greedy search, plus 12, 21 and P_n's own solution. If Landau holds, this finds a witness built only from the chosen frames, and shows the replacements from the outermost frame inward. Each step widens one point (shaded) into its frame.</p>
 <div class="bar"><button class="small" id="fm" style="${FMODE==='sym'?'background:var(--ink);color:var(--bg)':''}">symmetric frames</button><button class="small" id="fg" style="${FMODE==='greedy'?'background:var(--ink);color:var(--bg)':''}">greedy 23 frames</button></div><div class="nav"><button id="np">‹</button><span class="v">n = ${n}</span><button id="nn">›</button></div>${pl}<div class="stat">${st.msg}</div>
 <div class="bar"><button class="small" id="clr">clear</button><button class="small" id="rnd">random valid</button><button class="go" id="run" ${st.ok?"":"disabled"}>Build →</button></div><div id="out"></div>`;
 $("fm").onclick=()=>{FMODE="sym";memo.clear();builder()};$("fg").onclick=()=>{FMODE="greedy";memo.clear();builder()};$("bk").onclick=home;$("np").onclick=()=>{if(B.n>3){B.n--;B.stones.clear();builder()}};$("nn").onclick=()=>{if(B.n<9){B.n++;B.stones.clear();builder()}};
 $("clr").onclick=()=>{B.stones.clear();builder()};
 $("rnd").onclick=()=>{for(let t=0;t<5000;t++){const all=[];for(let d=-(B.n-1);d<B.n;d++)all.push(d);all.sort(()=>Math.random()-.5);const D=all.slice(0,B.n).sort((a,b)=>a-b);if(landauS(D).ok){B.stones=new Set(D);break}}builder();$("run").onclick()};
 document.querySelectorAll(".plank [data-d]").forEach(g=>g.onclick=()=>{const d=+g.dataset.d;B.stones.has(d)?B.stones.delete(d):(B.stones.size<B.n&&B.stones.add(d));builder()});
 $("run").onclick=()=>{const W=witnesses(D);const cnt=nd=>nd.leaf?0:1+nd.kids.reduce((a,k)=>a+cnt(k),0),big=nd=>nd.leaf?0:Math.max(nd.f.length,...nd.kids.map(big));
  const L=W.map(q=>({q,t:tree(q)})).filter(x=>x.t).map(x=>({...x,sc:big(x.t)*100+cnt(x.t)})).sort((a,b)=>a.sc-b.sc);
  if(!L.length){$("out").innerHTML=`<p class="empty">None of the ${W.length} witnesses can be built from the frame set.</p>`;return}
  let idx=0;const draw=()=>{const {q:p,t}=L[idx];
  const order=[];{let qu=[t];while(qu.length){const nd=qu.shift();if(nd.leaf)continue;order.push(nd);qu.push(...nd.kids)}}
  const open=new Set();let html=`<div class="nav"><button id="wp">‹</button><span class="v">build ${idx+1} of ${L.length}</span><button id="wn">›</button></div><p class="sub">${L.length} of the ${W.length} witnesses can be built from the set, ordered by largest frame used, then by number of steps. This one: <b>${p.join(" ")}</b>, ${order.length} replacement${order.length>1?"s":""}.</p><div class="steps">`;
  order.forEach((nd,k)=>{const before=materialize(t,open);const hiB=before.spans.get(nd);open.add(nd);const after=materialize(t,open);const hiA=after.spans.get(nd);
   html+=`<div class="step">${k?bsvg(before.perm,hiB,12):""}${k?'<span style="color:var(--ink2)">→</span>':""}${bsvg(after.perm,hiA)}<div class="txt">${k?`Widen the shaded point into frame <b>${nd.f.join(" ")}</b>`:`Start from frame <b>${nd.f.join(" ")}</b>`}<br><span class="cap">${after.perm.join(" ")}</span></div></div>`});
  $("out").innerHTML=html+"</div>";$("wp").onclick=()=>{idx=(idx-1+L.length)%L.length;draw()};$("wn").onclick=()=>{idx=(idx+1)%L.length;draw()}};draw()};
}

function home(){location.hash="";$("app").innerHTML=`<h1>Block-building experiments</h1><p class="sub">Searches that try to build every valid arrangement by widening points of smaller solutions into blocks. Each entry lists what it fails to build (or what it needs) for each n. Tap an entry.</p>`+
`<div class="card" id="bcard" style="border-color:var(--acc)"><div class="t">Build an arrangement from the frame set</div><div class="s">Place stones, then see the chain of block replacements, outermost frame first, that builds one of its witnesses.</div></div>`+E.map((e,i)=>`<div class="card" data-i="${i}"><div class="t">${e.title}</div><div class="s">${e.short}</div><div class="counts">${ns(e).map(n=>`<span>n=${n}: ${e.data[n].length}</span>`).join("")}</div></div>`).join("")+
`<p class="sub" style="margin-top:16px">Counts list ${'"primes"'} (arrangements the search could not build, which then join the basket) for the basket searches, including mirror images; arrangements without a robust expansion or not reached for the last ones (no tight cut, one of each mirror pair); and frames by size for the frame set. Orange points mark a board that repeats a diagonal. Code: agents/basket and agents/expand in the GitHub repo.</p>`;
document.querySelectorAll(".card[data-i]").forEach(c=>c.onclick=()=>show(+c.dataset.i));$("bcard").onclick=builder}
function show(i,n){const e=E[i],N=ns(e);n=n??N.find(k=>e.data[k].length)??N[0];location.hash="e="+e.id+"&n="+n;
let stats="";
if(e.stats){const ks=Object.keys(e.stats).sort((a,b)=>a-b);stats=`<table><tr><th>n</th><th>reached</th><th>missed</th><th>blocks: points</th><th>built from set</th><th>need a new frame</th></tr>`+ks.map(k=>{const s=e.stats[k];return `<tr><td>${k}</td><td>${s.reached}</td><td>${s.missed}</td><td>${s.point}</td><td>${s["built from set"]}</td><td>${s["needs new frame"]}</td></tr>`}).join("")+`</table>`}
const items=e.data[n]||[];
const grid=e.kind==="fixes"?(items.length?items.map(it=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="cap" style="font-size:13px"><b>${fmtD(it.D)}</b> · ${it.W} witnesses · ${it.fixes.length} frames that would fix it</div><div class="grid" style="margin-top:6px">`+it.fixes.map(z=>`<div class="item">${svg(z.f)}<div class="cap"><b>${z.f.join(" ")}</b><br>${z.f.length===it.D.length?"its own solution":"frame of size "+z.f.length}<br>e.g. ${z.w.join(" ")}</div>${z.bin?"":'<span class="tag w">repeats a diagonal</span>'}${z.sym?'<span class="tag">symmetric</span>':""}</div>`).join("")+`</div></div>`).join(""):`<p class="empty">Nothing missed at n = ${n}.</p>`):items.length?`<div class="grid">`+items.map(it=>e.kind==="frames"?
 `<div class="item">${svg(it.w)}<div class="cap"><b>${it.w.join(" ")}</b><br>covers ${it.cov}</div>${it.bin?"":'<span class="tag w">repeats a diagonal</span>'}</div>`:
 `<div class="item">${svg(it.w)}<div class="cap"><b>${fmtD(it.D)}</b><br>${it.W} witnesses · shown ${it.w.join(" ")}</div>${it.why?`<span class="tag">${it.why}</span>`:""}${it.nt===false?'<span class="tag">tight cut</span>':""}${it.mir?'<span class="tag">mirror of another</span>':""}</div>`).join("")+`</div>`:`<p class="empty">Nothing at n = ${n}.</p>`;
$("app").innerHTML=`<button class="back" id="bk">‹ all experiments</button><h2>${e.title}</h2><p class="long">${e.long}</p>${stats}
<table><tr><th>n</th>${N.map(k=>`<th>${k}</th>`).join("")}</tr><tr><td>${unit(e)}</td>${N.map(k=>`<td>${e.data[k].length}</td>`).join("")}</tr></table>
<div class="nav"><button id="np">‹</button><span class="v">${e.kind==="frames"?"frame size":"n"} = ${n} · ${items.length}</span><button id="nn">›</button></div>${grid}`;
$("bk").onclick=home;const j=N.indexOf(n);$("np").onclick=()=>show(i,N[(j-1+N.length)%N.length]);$("nn").onclick=()=>show(i,N[(j+1)%N.length])}
const m=location.hash.match(/e=([\w]+)&n=(\d+)/);if(location.hash==="#build")builder();else if(m){const i=E.findIndex(e=>e.id===m[1]);i>=0?show(i,+m[2]):home()}else home();
</script></body></html>
