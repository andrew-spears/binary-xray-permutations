<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary x-ray conjecture: progress dashboard</title>
<style>
/* VOICE: a research notebook's front page: quiet, precise, readable on a phone.
   LAYOUT: one column; tabs Overview / Families / Routes / Cards / Graph; a card opens as a sheet (full screen on phones).
   COLOUR: green proved, amber tested or computer-checked, grey open, red ruled out, blue active; same tokens as graph.html. */
:root{color-scheme:light dark;
  --bg:#fbfbfa;--ink:#16191d;--ink2:#5b626b;
  --line:#cfd4da;--card:#ffffff;--chip:#f0f1f2;
  --pr:#23804a;--em:#b07a06;--op:#6a717a;--no:#c0392f;
  --idea:#7442c8;--run:#2563c9;--wood:#c9a272;
  --hi:#c2410c;--lo:#0f766e}
/* older phone browsers have no light-dark(), so the dark palette is a media query */
@media (prefers-color-scheme:dark){:root{--bg:#121417;--ink:#e8eaed;--ink2:#9ca3ab;--line:#3a4048;--card:#1b1f24;--chip:#23282e;--pr:#4cbb76;--em:#e0aa3a;--op:#9ca3ab;--no:#ef6b61;--idea:#b493ff;--run:#6ea2ff;--wood:#8a6a44;--hi:#fb923c;--lo:#2dd4bf}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.hrow{max-width:980px;margin:0 auto}
h1{font-size:17px;margin:0 0 6px;font-weight:650;line-height:1.25}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -6px}nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:8px 10px;color:var(--ink2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:15px}
nav a.on{color:var(--ink);border-color:var(--ink);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:20px;margin:30px 0 6px;line-height:1.25}
h3{font-size:14px;color:var(--ink2);margin:18px 0 4px;font-weight:600}
p{margin:0 0 8px}
a{color:inherit}
.sub{color:var(--ink2);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);display:inline-block}
.s-proved,.s-reduction{--c:var(--pr)}.s-empirical,.s-tested,.s-computer{--c:var(--em)}.s-open,.s-stalled{--c:var(--op)}.s-disproved{--c:var(--no)}.s-idea{--c:var(--idea)}.s-active{--c:var(--run)}
.s-open>.dot,.s-stalled>.dot,.dot.s-open,.dot.s-stalled{background:none;border:1.5px dashed var(--op)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--chip);white-space:nowrap;font-size:13px;color:var(--ink2);text-decoration:none;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;height:100%;width:100%;text-align:left;background:color-mix(in srgb,var(--c) 8%,var(--card));border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));border-left:5px solid var(--c);border-radius:10px;padding:10px 12px}
.item.s-open,.item.s-stalled{border-left-style:dashed}
.item b{display:block;line-height:1.3;margin-bottom:3px}
.item .t{display:block;font-size:14px;color:var(--ink2);line-height:1.4}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.row{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 2px}
.row .dot{margin-top:7px}
.row small{display:block;color:var(--ink2);font-size:13px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hero .eyebrow{font-size:13px;color:var(--ink2);margin:0 0 2px}
.hero h2{margin:0 0 6px;font-size:22px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 0}
details.more{margin-top:10px}details.more>summary{cursor:pointer;color:var(--ink2);font-size:14px;padding:6px 0}details.more[open]>summary{display:none}
.rr .bar.thin{margin-top:5px;max-width:420px}
.stat{background:color-mix(in srgb,var(--c) 8%,var(--card));border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;text-decoration:none;display:block}
.stat b{font-size:22px;display:block;line-height:1.2}
.stat span{font-size:13px;color:var(--ink2)}
input[type=text],select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tools>*{flex:1 1 150px}.tools>input{flex:2 1 240px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:14px;margin:8px 0}
.bar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--chip)}
.bar i{display:block;height:100%}
.bar.thin{height:8px;border-radius:4px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:6px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tree{margin:0;padding:0;list-style:none}
.tree .tree{margin-left:8px;padding-left:10px;border-left:2px solid var(--line)}
.tree li{margin:8px 0}
.fam{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.fam .meta{grid-column:1/-1}
.word{font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
.glyph{display:block;flex:none}.glyph .ax{stroke:var(--line);stroke-width:1}.glyph .mdl{fill:var(--ink2)}.glyph .hi{fill:var(--hi)}.glyph .lo{fill:var(--lo)}
.hi{color:var(--hi)}.lo{color:var(--lo)}
.tiles{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.tile{border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 10%,var(--card));border-radius:6px;padding:3px 4px}
.seg-rest{--c:var(--em)}.seg-shape,.seg-nocross,.seg-tight{--c:var(--pr)}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.stepper b{min-width:26px;text-align:center}
.verdict{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);margin:8px 0}
.two{display:grid;grid-template-columns:1fr minmax(110px,150px);gap:12px;align-items:center;margin:6px 0}
.two svg{display:block;width:100%;height:auto}
.ok{color:var(--pr);font-weight:600}.no{color:var(--em);font-weight:600}.bad{color:var(--no);font-weight:600}
.gap{border-left:4px solid var(--em);background:color-mix(in srgb,var(--em) 8%,var(--card));border-radius:8px;padding:9px 12px;margin:10px 0}
.gap b{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.claim{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--card));border-radius:8px;padding:9px 12px;margin:12px 0}
.claim b{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.back{display:inline-block;margin:0 0 4px;color:var(--ink2);font-size:14px;text-decoration:none}
details.grp{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
details.grp>summary{cursor:pointer;font-weight:600;font-size:15px;padding:4px 0}
.day{font-size:13px;color:var(--ink2);font-weight:600;margin:14px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}
/* graph view */
body.graph{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.graph main{flex:1;max-width:none;width:100%;padding:0;min-height:0}
body.graph main iframe{width:100%;height:100%;border:0;display:block}
/* sheet */
#sheet{position:fixed;inset:0 0 0 auto;width:min(600px,100%);background:var(--card);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
#sheet[hidden]{display:none}
.phead{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.phead h2{margin:6px 0 4px;font-size:18px}
.phead .chips{display:flex;flex-wrap:wrap;gap:6px;margin-right:40px}
.pbtn{float:right;border:0;background:none;font-size:28px;line-height:1;width:44px;height:44px;margin:-10px -12px 0 0;color:var(--ink2)}
.pbody{flex:1;overflow-y:auto;padding:10px 16px 48px;min-height:0;overscroll-behavior:contain}
.pbody.frame{padding:0;overflow:hidden;display:flex;flex-direction:column}.pbody iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
.labbar{padding:8px 12px;border-bottom:1px solid var(--line)}.labbar button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px}
.lead{font-size:16px}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:9px;padding:3px;margin-top:8px}
.tab{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 4px;color:var(--ink2);font-size:14px}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
figure{margin:12px 0}.pics{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.pics svg{display:block;max-width:100%;height:auto}
.mid{font-size:13px;color:var(--ink2)}figcaption{font-size:13px;color:var(--ink2);margin-top:4px}
.pbody details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}.pbody summary{cursor:pointer;font-weight:600;font-size:14px}
pre{background:var(--chip);border-radius:8px;padding:9px 10px;font:12.5px/1.35 ui-monospace,Menlo,monospace;overflow-x:auto}
.link{display:flex;gap:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;margin:6px 0;text-align:left}
.link small{display:block;color:var(--ink2);font-size:13px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:13px;color:var(--ink2);margin:0 0 10px}
.crumbs button{border:0;background:none;padding:2px 0;color:var(--ink2);text-decoration:underline dotted;text-align:left}
.labable{position:relative;cursor:pointer;display:inline-block}.labable .labhint{position:absolute;right:2px;top:2px;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;margin:4px 6px 4px 0;text-decoration:none;font-size:15px}
table.cnt{border-collapse:collapse;font-size:14px;margin:6px 0}table.cnt td,table.cnt th{padding:3px 12px 3px 0;text-align:right;font-weight:400}table.cnt th{color:var(--ink2)}
@media (max-width:640px){
  header{padding:8px 12px 0}main{padding:12px 12px 80px}
  nav a{padding:8px 9px;font-size:14.5px}
  h2{font-size:19px}.hero h2{font-size:20px}
  #sheet{width:100%;border:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  body.sheet{overflow:hidden}
}
</style>
</head>
<body>
<header><div class="hrow">
  <h1>Binary x-ray conjecture: progress</h1>
  <nav id="nav">
    <a href="#/overview" data-v="overview">Overview</a><a href="#/families" data-v="families">Families</a><a href="#/routes" data-v="routes">Routes</a><a href="#/cards" data-v="cards">Cards</a><a href="#/graph" data-v="graph">Graph</a>
  </nav>
</div></header>
<main id="main"></main>
<aside id="sheet" hidden aria-label="Details"></aside>
<script src="graph.js"></script>
<script src="card.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const G = window.GRAPH, byId = Object.fromEntries(G.nodes.map(n => [n.id, n])), routeById = Object.fromEntries(G.routes.map(r => [r.id, r])), famById = Object.fromEntries(G.families.map(f => [f.id, f]));
const froms = e => Array.isArray(e.from) ? e.from : [e.from];
const FST = { proved: "Proved", reduction: "Splits into smaller cases", computer: "Complete computer search", tested: "Holds in tests", open: "No proof yet" };
const RST = { active: "Active", stalled: "Stalled", open: "Open" };
const ORDER = { proved: 0, empirical: 1, open: 2, idea: 3, disproved: 4 };
const chip = (cls, text) => `<span class="chip s-${cls}"><span class="dot"></span>${esc(text)}</span>`;
const fmt = e => (e < 0 ? "−" : "") + Math.abs(e);
const count = (list, st) => list.filter(n => n.status === st).length;
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const day = t => `${+t.slice(8, 10)} ${MON[+t.slice(5, 7) - 1]}${t.slice(0, 4) === G.updated.slice(0, 4) ? "" : " " + t.slice(0, 4)}`;
const T0 = G.nodes.reduce((m, n) => n.added < m ? n.added : m, "9");   // the first import: cards that carry it have no meaningful date
const pct = (a, b) => Math.round(100 * a / b);

// ---------- arrangements: words and families ----------
// A word lists, for each stone in order of diagonals, how many marks it sits above its evenly spaced place.
// Keep T1 and the proved kinds the same as in labs/covered.html.
function words(n) { const out = [], w = [];
  (function rec(s) { if (w.length === n) { if (s === 0) out.push(w.slice()); return; }
    const k = w.length, lo = k === 0 ? 0 : Math.max(-s, w[k - 1] - 1);
    for (let e = lo; e <= n; e++) { const left = n - k - 1; if (s + e + left * e > left * (left + 1) / 2) break; w.push(e); rec(s + e); w.pop(); } })(0);
  return out; }
function pieces(w) { const out = []; let s = 0, a = 0; for (let i = 0; i < w.length; i++) { s += w[i]; if (s === 0) { out.push(w.slice(a, i + 1)); a = i + 1; } } return out; }
const diag = w => w.map((e, k) => 2 * (k + 1) + e - w.length - 1);
const mx = q => Math.max(...q), mn = q => Math.min(...q);
const T1 = {   // tests on a piece with no tight cut
  even: q => mx(q) === 0 && mn(q) === 0,
  l1: q => mx(q) <= 1 && mn(q) >= -1,
  upone: q => mx(q) <= 1 || mn(q) >= -1,
  nocross: q => { const fh = q.findIndex(e => e >= 2); let ll = -1; q.forEach((e, i) => { if (e <= -2) ll = i; }); return fh < 0 || ll < fh; },
  uni: q => { let neg = false; for (const e of q) { if (e < 0) neg = true; else if (e > 0 && neg) return false; } return (mx(q) <= 2 && mn(q) >= -4) || (mx(q) <= 4 && mn(q) >= -2); },
  hill: q => { let i = 0; while (i < q.length && q[i] <= 1) i++; let j = i; while (j < q.length && q[j] >= 0 && q[j] <= 2) j++;
    let k = j; while (k < q.length && q[k] <= 0 && q[k] >= -2) k++; return q.slice(k).every(e => e >= -1); },
};
T1.cross = q => !T1.nocross(q);
T1.proved = q => T1.nocross(q) || T1.uni(q) || T1.hill(q);
const maxSlack = w => { let s = 0, m = 0; for (const e of w) { s += e; m = Math.max(m, s); } return m; };
const whole = f => w => pieces(w).length === 1 && f(w);
const FAM_TESTS = { all: w => true, tight: w => pieces(w).length > 1, notight: w => pieces(w).length === 1,
  even: T1.even, l1: whole(T1.l1), upone: whole(T1.upone), nocross: whole(T1.nocross), cross: whole(T1.cross),
  uni: whole(q => T1.cross(q) && T1.uni(q)), hill: whole(q => T1.cross(q) && T1.hill(q)),
  onehigh: whole(q => T1.cross(q) && q.filter(e => e >= 2).length === 1), rest: whole(q => !T1.proved(q)),
  slack16: w => maxSlack(w) <= 16, sym: w => w.every((e, i) => e === -w[w.length - 1 - i]) };
function why(q) { if (T1.even(q)) return q.length === 1 ? "a stone at its evenly spaced place" : "evenly spaced"; if (T1.l1(q)) return "every stone within one mark of evenly spaced";
  if (T1.upone(q)) return "no high stone, or no low stone"; if (T1.nocross(q)) return "every low stone comes before every high stone";
  if (T1.uni(q)) return "rises then falls with small letters"; if (T1.hill(q)) return "a gentle beginning, one hill, a gentle end"; return null; }
const WC = {}; const W = n => WC[n] ||= words(n);
// seg: which part of the coverage bar an arrangement belongs to
const SEG = [["rest", "No proof yet (solvable by computer search)", "var(--em)", .85], ["shape", "Rises then falls, or one hill", "var(--pr)", .5], ["nocross", "No high stone before a low stone", "var(--pr)", 1], ["tight", "Splits at tight cuts into proved pieces", "var(--pr)", .72]];
function seg(w) { const P = pieces(w); if (!P.every(T1.proved)) return "rest"; if (P.length > 1) return "tight"; return T1.nocross(w) ? "nocross" : "shape"; }
const SC = {}; function stat(n) { if (SC[n]) return SC[n]; const c = { total: 0, tight: 0, nocross: 0, shape: 0, rest: 0 }; for (const w of W(n)) { c.total++; c[seg(w)]++; } return SC[n] = c; }
function witness(D, budget = 300000) { const n = D.length, rows = Array(n + 1).fill(false), cols = Array(n + 2).fill(false), pts = [];
  const order = D.map((d, i) => i).sort((x, y) => Math.abs(D[y]) - Math.abs(D[x]));
  const rec = i => { if (i === n) return true; if (--budget < 0) return false; const d = D[order[i]];
    for (let r = Math.max(1, 1 - d); r <= Math.min(n, n - d); r++) { const c = r + d; if (rows[r] || cols[c]) continue;
      rows[r] = cols[c] = true; pts.push([r, c]); if (rec(i + 1)) return true; pts.pop(); rows[r] = cols[c] = false; } return false; };
  return rec(0) ? pts : null; }

// ---------- pictures of an arrangement ----------
function glyph(w, bw = 6, h = 30) { const n = w.length, H = Math.max(2, ...w.map(Math.abs)), mid = h / 2, u = (h / 2 - 2) / H;
  let s = `<svg class="glyph" viewBox="0 0 ${n * bw} ${h}" width="${n * bw}" height="${h}" aria-hidden="true"><path d="M0 ${mid}H${n * bw}" class="ax"/>`;
  w.forEach((e, i) => { const c = e >= 2 ? "hi" : e <= -2 ? "lo" : "mdl";
    s += e === 0 ? `<circle cx="${i * bw + bw / 2}" cy="${mid}" r="${bw / 5}" class="${c}"/>` : `<rect x="${i * bw + bw * .15}" y="${e > 0 ? mid - e * u : mid}" width="${bw * .7}" height="${Math.abs(e) * u}" class="${c}"/>`; });
  return s + "</svg>"; }
function bigBars(w) { const n = w.length, H = Math.max(2, ...w.map(Math.abs)), bw = 100 / n, u = 26 / H, mid = 32; let s = `<svg viewBox="0 0 100 64" role="img" aria-label="Bars: how far each stone is from its evenly spaced place">`, a = 0;
  pieces(w).forEach(q => { if (!T1.proved(q)) { const fh = q.findIndex(e => e >= 2); let ll = -1; q.forEach((e, i) => { if (e <= -2) ll = i; }); s += `<rect x="${(a + fh) * bw}" y="1" width="${(ll - fh + 1) * bw}" height="62" style="fill:var(--chip)"/>`; }
    a += q.length; if (a < n) s += `<path d="M${a * bw} 2V62" style="stroke:var(--ink2);stroke-width:.5;stroke-dasharray:2 2"/>`; });
  s += `<path d="M0 ${mid}H100" style="stroke:var(--line);stroke-width:.6"/>`;
  w.forEach((e, i) => { const col = e >= 2 ? "var(--hi)" : e <= -2 ? "var(--lo)" : "var(--ink)";
    s += e === 0 ? `<circle cx="${(i + .5) * bw}" cy="${mid}" r="${Math.min(1.5, bw * .25)}" style="fill:${col}"/>` : `<rect x="${i * bw + bw * .18}" y="${e > 0 ? mid - e * u : mid}" width="${bw * .64}" height="${Math.abs(e) * u}" rx=".8" style="fill:${col}"/>`; });
  return s + "</svg>"; }
function solBoard(w) { const D = diag(w), n = D.length; if (n > 16) return ""; const pts = witness(D); if (!pts) return ""; const c = 100 / n, col = new Map();
  w.forEach((e, i) => { if (e >= 2) col.set(D[i], "var(--hi)"); else if (e <= -2) col.set(D[i], "var(--lo)"); });
  let s = `<svg viewBox="-1 -1 102 102" role="img" aria-label="One solution on the board">`;
  for (let i = 0; i <= n; i++) s += `<path d="M0 ${i * c}H100M${i * c} 0V100" style="stroke:var(--line);stroke-width:.6;fill:none"/>`;
  for (const [r, q] of pts) s += `<circle cx="${(q - .5) * c}" cy="${(r - .5) * c}" r="${c * .3}" style="fill:${col.get(q - r) || "var(--ink)"}"/>`;
  return s + "</svg>"; }

    `<details><summary>Formal statement and details</summary>` + (n.intuition ? `<h3>Statement</h3><p>${esc(n.statement)}</p>` : "") +
    (n.example ? `<h3>Example</h3><pre>${esc(n.example)}</pre>` : "") + (n.refs ? `<h3>Source</h3><p class="sub">${esc(n.refs)}</p>` : "") +
    `<p class="sub">Card id: ${esc(n.id)}${n.added > T0 ? `. Added ${day(n.added)}` : ""}${n.was ? `. Was '${STATUS[n.was].toLowerCase()}' until ${day(n.since)}` : ""}.</p></details>` +
    `<p style="margin-top:14px"><a class="btn" href="#/graph/${n.id}">Show in the logic graph</a></p>`; }
function openCard(id, tab) { const n = byId[id], r = routeById[n.route];
  S.innerHTML = `<div class="phead"><button class="pbtn" data-close aria-label="Close">×</button><div class="chips">${chip(n.status, STATUS[n.status])}<a class="chip" href="#/routes/${r.id}">${esc(r.name)}</a>${dated(n) ? `<span class="chip">${n.was ? "changed" : "added"} ${dated(n)}</span>` : ""}</div><h2>${esc(n.title)}</h2>` +
    (n.vis ? `<div class="tabs"><button class="tab" data-tab="d">Explanation</button><button class="tab" data-tab="v">${esc(n.vis.title || "Lab")}</button></div>` : "") + `</div><div class="pbody" id="pbody"></div>`;
  const body = $("pbody"), show = t => { S.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
    if (t === "v") { body.className = "pbody frame"; body.innerHTML = labFrame(n.vis.file, n.vis.title || n.title); }
    else { body.className = "pbody"; body.innerHTML = explain(n); body.scrollTop = 0; } };
  S.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.tab)); show(tab && n.vis ? "v" : "d"); }
function openFam(f) { const ex = f.example ? parseWord(f.example) : null, t = f.test && FAM_TESTS[f.test], card = f.card && byId[f.card];
  let rows = ""; if (t) for (let n = 5; n <= 11; n++) { const ws = W(n), k = ws.filter(t).length; rows += `<tr><th>size ${n}</th><td>${k.toLocaleString("en")}</td><td>of ${ws.length.toLocaleString("en")}</td><td>${pct(k, ws.length)}%</td></tr>`; }
  const kids = G.families.filter(x => x.parent === f.id), par = f.parent && famById[f.parent];
  S.innerHTML = `<div class="phead"><button class="pbtn" data-close aria-label="Close">×</button><div class="chips">${chip(f.status, FST[f.status])}<span class="chip">Family</span></div><h2>${esc(f.name)}</h2></div><div class="pbody">
   <p class="lead">${esc(f.text)}</p>${f.check ? `<div class="gap"><b>Who checked the proof</b>${esc(f.check)}</div>` : ""}
   ${ex ? `<h3>Example</h3><div class="two"><div>${bigBars(ex)}</div><div>${solBoard(ex)}</div></div><p class="word">${wordHTML(ex)}</p><p class="sub">Left: one bar per stone, its distance above or below its evenly spaced place. Right: one solution on the board.</p>` : ""}
   ${card ? `<h3>${f.status === "proved" || f.status === "reduction" ? "The proof" : f.status === "open" ? "What is known" : "The evidence"}</h3>${nodeRow(card, [routeById[card.route].name])}` : ""}
   ${par ? `<h3>Special case of</h3><button class="link" data-fam="${par.id}"><span><span class="dot s-${par.status}" style="margin-right:6px"></span>${esc(par.name)}<small>${FST[par.status]}</small></span></button>` : ""}
   ${kids.length ? `<h3>Special cases</h3>${kids.map(k => `<button class="link" data-fam="${k.id}"><span><span class="dot s-${k.status}" style="margin-right:6px"></span>${esc(k.name)}<small>${FST[k.status]}</small></span></button>`).join("")}` : ""}
   ${rows ? `<h3>How many arrangements are of this kind</h3><table class="cnt">${rows}</table><p><button class="btn" data-atlas="${f.id}">Show them in the atlas</button></p>` : ""}</div>`; }

// ---------- routing: #/view[/arg][~sheet]; sheet is a card id or f.<family id> ----------
const VIEWS = { overview, families, routes, cards, graph }, SCROLL = {};
let cur = null, fwd = false, curSheet = "";
function parse() { let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch (e) {} const [path, sheet = ""] = h.split("~"), [, v = "overview", arg = ""] = path.split("/"); return { v: VIEWS[v] ? v : "overview", arg, sheet }; }
function route() { const { v, arg, sheet } = parse(), key = v + "/" + arg, back = !fwd; fwd = false;
  if (key !== cur) { if (cur) SCROLL[cur] = scrollY; cur = key; document.body.classList.toggle("graph", v === "graph"); $("main").innerHTML = VIEWS[v](arg);
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
    if (v === "cards") fillCards(); if (v === "families") atlas(); if (v === "graph") graphBoot(arg);
    scrollTo(0, back ? SCROLL[key] || 0 : 0); }
  const ok = sheet.startsWith("f.") ? famById[sheet.slice(2)] : byId[sheet];
  if (ok && sheet !== curSheet) { S.hidden = false; sheet.startsWith("f.") ? openFam(ok) : openCard(sheet, labNext); S.querySelector(".pbody").focus?.(); }
  if (!ok) { S.hidden = true; S.innerHTML = ""; }
  curSheet = ok ? sheet : ""; labNext = false; document.body.classList.toggle("sheet", !!ok); }
let labNext = false;
const nav = h => { fwd = true; if (location.hash === h) route(); else location.hash = h; };
const base = () => "#/" + cur.replace(/\/$/, "");
const sheet = id => nav(base() + (id ? "~" + id : ""));
document.addEventListener("click", e => { const t = e.target;
  const a = t.closest("a[href^='#']"); if (a) { const h = a.getAttribute("href"); if (h.startsWith("#/")) fwd = true; else { e.preventDefault(); document.getElementById(h.slice(1))?.scrollIntoView({ behavior: "smooth" }); } return; }
  const lb = t.closest(".labable[data-lab]"); if (lb && S.contains(lb)) { const body = $("pbody"), keep = body.innerHTML; body.className = "pbody frame";
    body.innerHTML = `<div class="labbar"><button data-labback>← Back to the card</button></div>` + labFrame("labs/views.html", "Four equivalent views", "p=" + lb.dataset.lab);
    body.querySelector("[data-labback]").onclick = () => { body.className = "pbody"; body.innerHTML = keep; }; return; }
  const c = t.closest("[data-card]"); if (c) { labNext = !!c.dataset.lab; return sheet(c.dataset.card); }
  const f = t.closest("[data-fam]"); if (f) return sheet("f." + f.dataset.fam);
  if (t.closest("[data-close]")) return sheet("");
  const at = t.closest("[data-atlas]"); if (at) { AF = at.dataset.atlas; nav("#/families"); atlas(); return setTimeout(() => $("atlas").scrollIntoView(), 0); }
  const an = t.closest("[data-an]"); if (an) { AN = Math.max(4, Math.min(10, AN + +an.dataset.an)); return atlas(); }
  const w = t.closest("[data-word]"); if (w) { $("lookup").value = w.dataset.word; lookup(w.dataset.word); $("look").scrollIntoView({ behavior: "smooth" }); } });
document.addEventListener("input", e => { const t = e.target; if (t.id === "lookup") lookup(t.value);
  if (t.id === "q") { Q = t.value; fillCards(); } if (t.id === "st") { ST = t.value; fillCards(); } if (t.id === "rt") { RT = t.value; fillCards(); }
  if (t.id === "sort") { SORT = t.value; fillCards(); } if (t.id === "lab") { LAB = t.checked; fillCards(); } if (t.id === "af") { AF = t.value; atlas(); } });
addEventListener("keydown", e => { if (e.key === "Escape" && !S.hidden) sheet(""); });
addEventListener("message", e => { if (e.data && "graphCard" in e.data && cur && cur.startsWith("graph/")) { const id = byId[e.data.graphCard] ? e.data.graphCard : ""; cur = "graph/" + id; try { history.replaceState(null, "", "#/graph" + (id ? "/" + id : "")); } catch (err) {} } });
window.DASH = { W, T1, FAM_TESTS, stat, parseWord, pieces, openCard, openFam, VIEWS };   // for checks from the console
addEventListener("hashchange", route); route();
}
</script>
</body>
