<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic graph: binary x-ray conjecture</title>
<style>
/* VOICE: a research notebook's logic map — clinical, quiet, precise.
   IDEA: a proof-dependency chart pinned above the desk: claims as cards, arrows as "would prove".
   PICTURE: the graph itself, full-bleed; status colours carry the meaning; each claim explained with the stones-and-board pictures.
   COLOUR and TYPE: white / near-black ground; green proved, amber tested, grey open, red ruled out, violet ideas; blue only for "running". System sans.
   LAYOUT: one column per line of attack, the no-tight-cut case and the conjecture at the bottom; details in a resizable side panel (bottom sheet on phones). */
:root{color-scheme:light dark;
  --bg:light-dark(#fbfbfa,#121417);--ink:light-dark(#16191d,#e8eaed);--ink2:light-dark(#5b626b,#9ca3ab);
  --line:light-dark(#cfd4da,#3a4048);--card:light-dark(#ffffff,#1b1f24);--chip:light-dark(#f0f1f2,#23282e);
  --pr:light-dark(#23804a,#4cbb76);--em:light-dark(#b07a06,#e0aa3a);--op:light-dark(#6a717a,#9ca3ab);--no:light-dark(#c0392f,#ef6b61);
  --idea:light-dark(#7442c8,#b493ff);--run:light-dark(#2563c9,#6ea2ff);--wood:light-dark(#c9a272,#8a6a44)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{padding:10px 14px 6px;border-bottom:1px solid var(--line)}
h1{font-size:18px;line-height:1.2;margin:0 0 6px;font-weight:650}
.bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--chip);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.s-proved{--c:var(--pr)}.s-empirical{--c:var(--em)}.s-open{--c:var(--op)}.s-disproved{--c:var(--no)}.s-idea{--c:var(--idea)}
.s-open .dot{background:none;border:1.5px dashed var(--op)}
.ekey{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ekey svg{width:30px;height:12px;overflow:visible}
button{font:inherit;color:inherit;cursor:pointer}
.tb{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:36px;height:32px;padding:0 10px}
.tb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb:focus-visible,.node:focus-visible,.link:focus-visible,.tab:focus-visible,.junc:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#key{display:none}
#warn{background:color-mix(in srgb,var(--no) 14%,var(--bg));font-size:13px;padding:6px 14px;border-bottom:1px solid var(--line)}
main{flex:1;display:flex;position:relative;min-height:0}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible}
.e{fill:none;stroke:var(--ink2);stroke-width:1.6}
.e.partial{stroke-dasharray:1.5 4;stroke-linecap:round;stroke-width:2}
.e.unchecked{stroke-dasharray:6 4}
.e.dead{stroke:var(--no);opacity:.45;stroke-dasharray:3 4}
.e.related{stroke-width:1.1;opacity:.6}
.e.idea{stroke:var(--idea);stroke-dasharray:2 5;stroke-linecap:round;stroke-width:2;opacity:.85}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.node{position:absolute;width:156px;height:62px;border-radius:10px;padding:7px 9px 7px 10px;
  background:color-mix(in srgb,var(--c) 13%,var(--card));border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);
  font-size:12.5px;line-height:1.25;display:flex;gap:7px;align-items:flex-start;cursor:pointer;text-align:left;transition:opacity .15s}
.node.s-open{background:var(--card);border-style:dashed}
.node.s-idea{border-style:dashed;border-width:2px}
.node .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .dot{margin-top:3px}
.node.goal{width:250px;height:66px;font-size:14px;font-weight:650;border-width:2.5px}
.node.has-vis{padding-right:30px}
.vis{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:5px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.vis svg{width:12px;height:12px}
.node.sel{box-shadow:0 0 0 3px var(--ink)}
.junc{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--card);border:1.6px solid var(--ink2);color:var(--ink2);font-size:14px;font-weight:700;display:grid;place-items:center;pointer-events:none}
.run{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--run);box-shadow:0 0 0 3px var(--bg)}
@media (prefers-reduced-motion:no-preference){.run{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}
.alabel{position:absolute;width:156px;font-size:12px;font-weight:600;color:var(--ink2);text-align:center}
.dim{opacity:.18}
#panel{position:relative;width:420px;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
#panel.wide{width:520px}
#panel[hidden]{display:none}
.vgrip{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:2;touch-action:none}
.vgrip::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:3px;background:var(--line)}
.grip{display:none;touch-action:none;cursor:row-resize;padding:8px 0 6px;margin:-12px -16px 0}
.grip::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
#panel.dragging iframe{pointer-events:none}
.phead{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.pbtn{float:right;border:0;background:none;font-size:20px;line-height:1;width:40px;height:36px;margin:-6px -8px 0 0;color:var(--ink2)}
.pbody{flex:1;overflow-y:auto;padding:8px 16px 28px;min-height:0}
.pbody.frame{padding:0;overflow:hidden}
.pbody iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.pbody.lab{display:flex;flex-direction:column}.pbody.lab iframe{flex:1;height:auto}
.labbar{padding:8px 12px;border-bottom:1px solid var(--line)}.labbar button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.labable{position:relative;cursor:pointer;display:inline-block}.labable .labhint{position:absolute;right:2px;top:2px;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
#panel h2{font-size:18px;line-height:1.25;margin:6px 0 4px}
#panel h3{font-size:13px;color:var(--ink2);margin:18px 0 4px;font-weight:600}
#panel p{margin:0 0 6px}
.lead{font-size:16px;line-height:1.5}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:9px;padding:3px;margin-top:8px}
.tab{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 0;color:var(--ink2);font-size:14px}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
figure{margin:12px 0}
.pics{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pics svg{display:block;max-width:100%;height:auto}
.mid{font-size:13px;color:var(--ink2);white-space:nowrap}
figcaption{font-size:13px;color:var(--ink2);margin-top:4px}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
pre{background:var(--chip);border-radius:8px;padding:9px 10px;font:12.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;margin:4px 0 6px}
.link{display:flex;gap:8px;align-items:flex-start;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;margin:6px 0;text-align:left}
.link .k{font-weight:700;color:var(--ink2);flex:none;min-width:22px}
.link small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.route button{border:none;background:none;padding:2px 0;color:var(--ink2);text-decoration:underline dotted;font:inherit;cursor:pointer}
.route .here{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--ink2)}
@media (max-width:899px){
  #key{display:inline-block}
  #legend{display:none}#legend.open{display:block}
  #panel,#panel.wide{position:fixed;inset:0;width:auto;height:auto!important;border:0;border-radius:0;z-index:30}
  .vgrip{display:none}.grip{display:none}
  .pbtn[data-full]{display:none}
  h1{font-size:16px}
}
</style>
</head>
<body>
<header>
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400">← Dashboard</a> &nbsp;·&nbsp; Logic graph</h1>
  <div id="legend">
  <div class="bar">
    <span class="chip s-proved"><span class="dot"></span>Proved</span>
    <span class="chip s-empirical"><span class="dot"></span>Holds in tests</span>
    <span class="chip s-open"><span class="dot"></span>Open</span>
    <span class="chip s-disproved"><span class="dot"></span>Ruled out</span>
    <span class="chip s-idea"><span class="dot"></span>Idea to try</span>
    <span class="chip"><span class="dot" style="--c:var(--run)"></span>Running now</span>
    <span class="chip"><span class="vis" style="position:static;width:16px;height:16px"><svg viewBox="0 0 12 12"><path d="M1 1h4v4H1zM7 1h4v4H7zM1 7h4v4H1zM7 7h4v4H7z" fill="currentColor"/></svg></span>Interactive lab</span>
  </div>
  <div class="bar" style="margin-top:6px">
    <span class="ekey"><svg viewBox="0 0 30 12"><line x1="0" y1="6" x2="24" y2="6" class="e"/><path d="M22,2 L30,6 L22,10z" style="fill:var(--ink2)"/></svg>implies</span>
    <span class="ekey"><span class="junc" style="position:static;width:18px;height:18px;font-size:11px">∧</span>together imply</span>
    <span class="ekey"><svg viewBox="0 0 30 12"><line x1="0" y1="6" x2="30" y2="6" class="e related"/></svg>related fact (not an implication)</span>
    <span class="ekey">several arrows into one claim = alternative routes</span>
    <span class="ekey"><svg viewBox="0 0 30 12"><line x1="0" y1="6" x2="30" y2="6" class="e unchecked"/></svg>not yet checked</span>
    <span class="ekey"><svg viewBox="0 0 30 12"><line x1="0" y1="6" x2="30" y2="6" class="e idea"/></svg>idea</span>
  </div>
  </div>
  <div class="bar" style="margin-top:6px">
    <span style="flex:1"></span>
    <button class="tb" id="key" aria-pressed="false">Key</button>
    <button class="tb" id="hide" aria-pressed="false">Hide ruled out</button>
  </div>
</header>
<div id="warn" hidden></div>
<main id="main">
  <div id="vp"><div id="world"></div></div>
  <aside id="panel" hidden></aside>
</main>
<script src="graph.js"></script>
<script src="card.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const NW = 156, NH = 62, GW = 250, GH = 66, JW = 26, COLW = 188, ROWH = 90, TOP = 34;
const PARTIAL = new Set(["case", "reduces", "related"]);
const VIS_ICON = '<span class="vis" title="Interactive lab"><svg viewBox="0 0 12 12"><path d="M1 1h4v4H1zM7 1h4v4H7zM1 7h4v4H1zM7 7h4v4H7z" fill="currentColor"/></svg></span>';
let G, byId, J = [], pos = {}, hideDead = false, sel = null, view = { x: 0, y: 0, s: 1 }, worldW = 0, worldH = 0, segs = [];
const size = { w: null, h: null };
const froms = e => Array.isArray(e.from) ? e.from : [e.from];
const narrow = () => innerWidth < 900;

Promise.resolve(window.GRAPH).then(g => {
  G = g; byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
  J = g.edges.map((e, i) => Array.isArray(e.from) ? { id: "j" + i, edge: i, area: byId[e.from[0]].area } : null).filter(Boolean);
  check(); layout(); fit();
  const h = location.hash.slice(1); if (h.startsWith("n-") && byId[h.slice(2)]) select(h.slice(2), true);
}).catch(() => { $("vp").innerHTML = '<p style="padding:20px">Could not load graph.json.</p>'; });

function check() {
  const bad = G.edges.filter(e => !PARTIAL.has(e.kind) && e.kind !== "idea" && e.status === "proved" && froms(e).every(f => byId[f].status === "proved") && byId[e.to].status !== "proved");
  if (bad.length) { $("warn").hidden = false; $("warn").textContent = "Inconsistent: " + bad.map(e => froms(e).map(f => byId[f].title).join(" + ") + " ⇒ " + byId[e.to].title).join("; ") + " — the target should then be proved."; }
}

// ---------- layout: layered tree, root (the conjecture) at the top ----------
// Rows = longest path to the conjecture, so every arrow points strictly upward.
// Each claim hangs under one parent in the row directly above. Subtrees are packed by their
// row-by-row outlines (Reingold–Tilford style), so a childless sibling sits right next to a big one.
// Arrows into the same claim merge into one bus: up from each source, along a rail, one arrowhead in.
const visible = id => { const n = byId[id]; return !n || !(hideDead && n.status === "disproved"); };
const LH = 150, GAP = 22;
let buses = [];
function dims(id) { const n = byId[id]; if (!n) return [JW, JW]; return (id === "conj" || id === "notight") ? [GW, GH] : [NW, NH]; }
function layout() {
  const nodes = G.nodes.filter(n => visible(n.id));
  const juncs = J.filter(j => froms(G.edges[j.edge]).every(visible));
  segs = [];
  G.edges.forEach((e, i) => {
    if (!visible(e.to)) return;
    if (Array.isArray(e.from)) { const j = "j" + i; if (!juncs.find(x => x.id === j)) return; e.from.forEach(f => segs.push([f, j, i, false])); segs.push([j, e.to, i, true]); }
    else if (visible(e.from)) segs.push([e.from, e.to, i, true]);
  });
  const out = {}; segs.forEach(([a, b]) => (out[a] ||= []).push(b));
  const h = {}; const H = id => h[id] ?? (h[id] = id === "conj" ? 0 : 1 + Math.max(-1, ...(out[id] || []).map(H)));
  const ids = [...nodes.map(n => n.id), ...juncs.map(j => j.id)].filter(id => { H(id); return h[id] >= 0; });
  const kids = {}; const AO = Object.fromEntries(G.areas.map((a, k) => [a.id, k]));
  const area = v => byId[v]?.area ?? J.find(j => j.id === v)?.area ?? "";
  ids.forEach(v => { if (v === "conj") return; const p = (out[v] || []).find(t => h[t] === h[v] - 1) ?? (out[v] || [])[0]; if (p !== undefined) (kids[p] ||= []).push(v); });
  Object.values(kids).forEach(list => list.sort((p, q) => (AO[area(p)] ?? -1) - (AO[area(q)] ?? -1)));
  // contour packing: build(v) -> { x: {node: offset from v}, c: {row: [left, right]} }
  const build = v => {
    const w = dims(v)[0], ch = kids[v] || [];
    if (!ch.length) return { x: { [v]: 0 }, c: { [h[v]]: [-w / 2, w / 2] } };
    const acc = { x: {}, c: {} }, roots = [];
    ch.forEach((c, k) => {
      const t = build(c); let shift = 0;
      if (k) { shift = -Infinity; for (const r in t.c) if (acc.c[r]) shift = Math.max(shift, acc.c[r][1] - t.c[r][0] + GAP); if (shift === -Infinity) shift = roots[roots.length - 1]; }
      for (const n in t.x) acc.x[n] = t.x[n] + shift;
      for (const r in t.c) { const [l, rr] = t.c[r]; acc.c[r] = acc.c[r] ? [Math.min(acc.c[r][0], l + shift), Math.max(acc.c[r][1], rr + shift)] : [l + shift, rr + shift]; }
      roots.push(shift);
    });
    const px = (roots[0] + roots[roots.length - 1]) / 2;
    const res = { x: { [v]: 0 }, c: { [h[v]]: [-w / 2, w / 2] } };
    for (const n in acc.x) res.x[n] = acc.x[n] - px;
    for (const r in acc.c) res.c[r] = [acc.c[r][0] - px, acc.c[r][1] - px];
    return res;
  };
  const T = build("conj");
  const minL = Math.min(...Object.values(T.c).map(c => c[0])), maxR = Math.max(...Object.values(T.c).map(c => c[1]));
  pos = {};
  for (const v in T.x) { const [w, hh] = dims(v), cx = T.x[v] - minL + 20, cy = TOP + h[v] * LH + GH / 2;
    pos[v] = { x: cx - w / 2, y: cy - hh / 2, w, h: hh, cx, cy, row: h[v] }; }
  worldW = maxR - minL + 40; worldH = TOP + Math.max(...Object.keys(T.x).map(v => h[v])) * LH + GH + 30;
  // buses: one per target, rails staggered within a row
  const byT = {}; segs.forEach(([a, b, i, last]) => { if (pos[a] && pos[b]) (byT[b] ||= []).push({ a, i, last }); });
  const rowT = {}; Object.keys(byT).forEach(b => (rowT[pos[b].row] ||= []).push(b));
  const rowBot = {}; Object.values(pos).forEach(p => { if (p.row !== undefined && p.h) rowBot[p.row] = Math.max(rowBot[p.row] || 0, p.y + p.h); });
  const rail = {}; Object.values(rowT).forEach(list => list.sort((p, q) => pos[p].cx - pos[q].cx).forEach((b, k) => rail[b] = (rowBot[pos[b].row] || pos[b].y + pos[b].h) + 16 + 9 * (k % 4)));
  buses = Object.entries(byT).map(([b, ins]) => ({ b, ins, y: rail[b] }));
  let html = nodes.filter(n => pos[n.id]).map(n => { const p = pos[n.id];
    return `<div class="node s-${n.status}${n.id === "conj" || n.id === "notight" ? " goal" : ""}${n.vis ? " has-vis" : ""}" role="button" tabindex="0" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px">` +
      `<span class="dot"></span><span class="t">${esc(n.title)}</span>${n.vis ? VIS_ICON : ""}${n.active ? `<span class="run" title="${esc(n.active)}"></span>` : ""}</div>`; }).join("");
  html += juncs.filter(j => pos[j.id]).map(j => { const p = pos[j.id]; return `<div class="junc" data-j="${j.edge}" style="left:${p.x}px;top:${p.y}px">∧</div>`; }).join("");
  $("world").innerHTML = `<svg id="edges" width="${worldW}" height="${worldH}">${edgesSVG()}</svg>` + html;
  $("world").style.width = worldW + "px"; $("world").style.height = worldH + "px";
  if (sel && !pos[sel]) closePanel(); else if (sel) highlight(sel);
}
function edgeClass(e) {
  if (e.kind === "idea") return "e idea";
  if (e.kind === "related") return "e related";
  return `e${e.status !== "proved" ? " unchecked" : ""}`;
}
function edgesSVG() {
  const mk = (id, col) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9z" style="fill:${col}"/></marker>`;
  let back = "", front = "";
  buses.forEach(({ b, ins, y }) => {
    const B = pos[b], x1 = B.cx, y1 = B.y + B.h;
    let strongest = null;
    ins.forEach(({ a, i }) => {
      const A = pos[a], e = G.edges[i], x0 = A.cx, y0 = A.y, cls = edgeClass(e), r = Math.min(8, Math.abs(x1 - x0) / 2), dir = x1 > x0 ? 1 : -1;
      // if the straight climb would pass behind another node, jog sideways just above the source first
      const blocks = Object.entries(pos).filter(([v, q]) => v !== a && v !== b && q.y < y0 - 2 && q.y + q.h > y).map(([, q]) => [q.x - 8, q.x + q.w + 8]);
      const free = x => blocks.every(([l, rr]) => x < l || x > rr);
      let xs = x0;
      if (!free(x0)) { const m = []; blocks.slice().sort((p, q) => p[0] - q[0]).forEach(([l, rr]) => { if (m.length && l <= m[m.length - 1][1]) m[m.length - 1][1] = Math.max(m[m.length - 1][1], rr); else m.push([l, rr]); });
        const cand = m.flat().map((v, k) => k % 2 ? v + 1 : v - 1).sort((p, q) => Math.abs(p - x0) - Math.abs(q - x0)); if (cand.length) xs = cand[0]; }
      const yj = y0 - 14;
      const climb = xs === x0 ? `M${x0},${y0}` : `M${x0},${y0} V${yj} H${xs}`;
      const r2 = Math.min(8, Math.abs(x1 - xs) / 2), dir2 = x1 > xs ? 1 : -1;
      const d = Math.abs(x1 - xs) < 1 ? `${climb} V${y}` : `${climb} V${y + r2} Q${xs},${y} ${xs + dir2 * r2},${y} H${x1}`;
      const start = e.kind === "equiv" ? ` marker-start="url(#a)"` : "";
      const p = `<path class="${cls}" d="${d}"${start} data-e="${i}"/>`;
      if (cls === "e") front += p; else back += p;
      const rank = cls === "e" ? 3 : cls.includes("unchecked") && !cls.includes("dead") ? 2 : cls.includes("idea") ? 1 : cls.includes("related") ? -1 : 0;
      if (!strongest || rank > strongest.rank) strongest = { rank, cls, i };
    });
    // one stub into the target, styled by the strongest incoming route
    if (strongest.rank >= 0) { const head = strongest.cls.includes("idea") ? "ai" : strongest.cls.includes("dead") ? "ad" : "a";
      front += `<path class="${strongest.cls}" d="M${x1},${y} V${y1}" marker-end="url(#${head})" data-stub="${b}"/>`; }
    else front += `<path class="${strongest.cls}" d="M${x1},${y} V${y1}" data-stub="${b}"/>`;
  });
  return `<defs>${mk("a", "var(--ink2)")}${mk("ad", "var(--no)")}${mk("ai", "var(--idea)")}</defs>` + back + front;
}

// ---------- pan / zoom ----------
const vp = $("vp");
function apply() { $("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; }
function fit() {
  const W = vp.clientWidth, Hh = vp.clientHeight, s = Math.min(W / (worldW + 40), Hh / (worldH + 40), 1.2);
  view = { s, x: (W - worldW * s) / 2, y: Math.max(10, (Hh - worldH * s) / 2) }; apply();
}
function zoomAt(f, cx, cy) {
  const s = Math.max(0.15, Math.min(3, view.s * f)); f = s / view.s;
  view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.s = s; apply();
}
const ptr = new Map(); let downTarget = null, moved = false, last = null;
vp.addEventListener("pointerdown", e => { ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptr.size === 1) { downTarget = e.target; moved = false; } last = null; });
addEventListener("pointermove", e => {
  if (!ptr.has(e.pointerId)) return;
  const p = ptr.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (ptr.size === 1) { if (Math.abs(dx) + Math.abs(dy) > 4) moved = true; if (moved) { view.x += dx; view.y += dy; apply(); } }
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptr.size === 2) { moved = true;
    const [a, b] = [...ptr.values()], r = vp.getBoundingClientRect(), d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    if (last) { view.x += mx - last.mx; view.y += my - last.my; zoomAt(d / last.d, mx, my); }
    last = { d, mx, my }; }
});
const up = e => { if (!ptr.has(e.pointerId)) return; ptr.delete(e.pointerId); last = null;
  if (ptr.size === 0 && !moved && e.type === "pointerup") tap(downTarget); };
addEventListener("pointerup", up); addEventListener("pointercancel", up);
vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); } }, { passive: false });
$("key").onclick = () => { const o = $("legend").classList.toggle("open"); $("key").setAttribute("aria-pressed", o); requestAnimationFrame(() => { if (!sel) fit(); }); };
$("hide").onclick = () => { hideDead = !hideDead; $("hide").setAttribute("aria-pressed", hideDead); layout(); fit(); };
vp.addEventListener("keydown", e => { if (e.key !== "Enter" && e.key !== " ") return; const n = e.target.closest?.(".node");
  if (n) { e.preventDefault(); select(n.dataset.id); } });
function tap(t) {
  const n = t?.closest?.(".node"); if (n) return select(n.dataset.id);
  closePanel();
}

// ---------- panel: open, resize, content ----------
const P = $("panel");
function sizePanel() {
  P.style.width = !narrow() && size.w ? size.w + "px" : "";
  P.style.height = "";
}
function openPanel(wide, inner) {
  P.classList.toggle("wide", wide); P.hidden = false; sizePanel();
  P.innerHTML = `<div class="vgrip" aria-hidden="true"></div>` + inner;
  const mainR = () => $("main").getBoundingClientRect();
  const drag = (el, onMove, onTap) => { if (!el) return; el.addEventListener("pointerdown", e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); P.classList.add("dragging"); let mv = false; const sx = e.clientX, sy = e.clientY;
    const move = ev => { if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) mv = true; if (mv) onMove(ev); };
    const end = () => { P.classList.remove("dragging"); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", end); el.removeEventListener("pointercancel", end); if (!mv && onTap) onTap(); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); }); };
  drag(P.querySelector(".vgrip"), ev => { const r = mainR(); size.w = Math.max(300, Math.min(r.width, r.right - ev.clientX)); sizePanel(); });
  // phones: drag the card's top to resize; tap it to toggle half / full screen (full covers the header)
  const ph = P.querySelector(".phead");
  if (ph && false) ph.addEventListener("pointerdown", e => {
    if (!narrow() || e.target.closest("button")) return;
    e.preventDefault(); ph.setPointerCapture(e.pointerId); P.classList.add("dragging"); let mv = false; const sy = e.clientY, h0 = P.offsetHeight;
    const move = ev => { if (Math.abs(ev.clientY - sy) > 5) mv = true; if (mv) { size.h = Math.max(110, Math.min(innerHeight, h0 + (sy - ev.clientY))); sizePanel(); } };
    const end = () => { P.classList.remove("dragging"); ph.removeEventListener("pointermove", move); ph.removeEventListener("pointerup", end); ph.removeEventListener("pointercancel", end);
      if (!mv) toggleFull(); else if (size.h > innerHeight * 0.85) { size.h = innerHeight; sizePanel(); } };
    ph.addEventListener("pointermove", move); ph.addEventListener("pointerup", end); ph.addEventListener("pointercancel", end); });
}
function toggleFull() {
  const r = $("main").getBoundingClientRect();
  if (narrow()) size.h = P.offsetHeight >= innerHeight - 4 ? Math.round(innerHeight * .5) : innerHeight;
  else size.w = P.offsetWidth >= r.width - 4 ? Math.round(r.width * .5) : r.width;
  sizePanel();
}
function head(chip, title, extra = "") {
  return `<div class="phead"><div class="grip" aria-label="Drag to resize; tap to toggle full screen"></div><button class="pbtn" data-close aria-label="Close">×</button><button class="pbtn" data-full aria-label="Full screen" title="Full screen / half">⤢</button>${chip}<h2>${esc(title)}</h2>${extra}</div>`;
}
P.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return select(g.dataset.go, true);
  const lb = e.target.closest("[data-lab]"); if (lb) { const body = $("pbody"); if (!body) return; const back = body.innerHTML, cls = body.className, wasWide = P.classList.contains("wide");
    P.classList.add("wide"); body.className = "pbody frame lab";
    body.innerHTML = `<div class="labbar"><button data-back>← Back to card</button></div><iframe src="labs/views.html#p=${lb.dataset.lab}" title="Four equivalent views"></iframe>`;
    body.querySelector("[data-back]").onclick = ev => { ev.stopPropagation(); body.className = cls; body.innerHTML = back; P.classList.toggle("wide", wasWide); };
    return; }
  if (e.target.closest("[data-close]")) return closePanel();
  if (e.target.closest("[data-full]")) return toggleFull();
});
function highlight(id) {
  const nb = new Set([id]), touch = new Set();
  G.edges.forEach((e, i) => { const f = froms(e); if (f.includes(id) || e.to === id) { touch.add(i); f.forEach(x => nb.add(x)); nb.add(e.to); } });
  document.querySelectorAll(".node").forEach(el => { el.classList.toggle("dim", !nb.has(el.dataset.id)); el.classList.toggle("sel", el.dataset.id === id); });
  document.querySelectorAll(".junc").forEach(el => el.classList.toggle("dim", !touch.has(+el.dataset.j)));
  document.querySelectorAll("path.e[data-e]").forEach(p => p.classList.toggle("dim", !touch.has(+p.dataset.e)));
  document.querySelectorAll("path.e[data-stub]").forEach(p => { const b = p.dataset.stub; p.classList.toggle("dim", !(nb.has(b) || (b[0] === "j" && !byId[b] && touch.has(+b.slice(1))))); });
}
function clearHL() { document.querySelectorAll(".dim,.sel").forEach(el => el.classList.remove("dim", "sel")); }
function closePanel() { sel = null; P.hidden = true; P.innerHTML = ""; clearHL(); history.replaceState(null, "", location.pathname + location.search); }
function centerOn(id) { const p = pos[id]; if (!p) return; const W = vp.clientWidth, Hh = vp.clientHeight;
  view.x = W / 2 - (p.x + p.w / 2) * view.s; view.y = (narrow() ? Hh * 0.2 : Hh / 2) - (p.y + p.h / 2) * view.s; apply(); }
function chipFor(id) { const n = byId[id]; return `<span class="chip s-${n.status}" style="padding:1px 6px;margin-right:4px"><span class="dot"></span></span>${esc(n.title)}`; }
function edgeItem(e, id, dir) {
  const f = froms(e), part = PARTIAL.has(e.kind), joint = f.length > 1, idea = e.kind === "idea";
  let k, label;
  if (dir === "out") { k = idea ? "?" : part ? "∘" : e.kind === "equiv" ? "⇔" : "⇒"; label = (joint ? "with " + f.filter(x => x !== id).map(x => esc(byId[x].title)).join(", ") + " → " : "") + chipFor(e.to); }
  else { k = idea ? "?" : part ? "∘" : e.kind === "equiv" ? "⇔" : joint ? "∧" : "⇐"; label = f.map(chipFor).join(joint ? " + " : ""); }
  const go = dir === "out" ? e.to : f[0];
  return `<button class="link" data-go="${go}"><span class="k">${k}</span><span>${label}<small>${part ? (e.kind === "related" ? "Related fact, not an implication. " : "Settles part of it. ") : ""}${esc(e.why)}${e.status !== "proved" && !idea ? " (not yet checked)" : ""}</small></span></button>`;
}
function routeTo(id) {
  const prev = { [id]: null }, q = [id];
  while (q.length) { const v = q.shift(); if (v === "conj") break;
    for (const e of G.edges) if (froms(e).includes(v) && !(e.to in prev)) { prev[e.to] = v; q.push(e.to); } }
  if (!("conj" in prev)) return [];
  const path = []; for (let v = "conj"; v; v = prev[v]) path.push(v); return path;
}
function routeHTML(id) {
  const p = routeTo(id); if (p.length < 2) return "";
  return `<div class="route">` + p.map((v, i) => (i ? "<span>›</span>" : "") + (v === id ? `<span class="here">This card</span>` : `<button data-go="${v}">${esc(byId[v].title)}</button>`)).join("") + `</div>`;
}
function explain(n) {
  const outs = G.edges.filter(e => froms(e).includes(n.id)), ins = G.edges.filter(e => e.to === n.id);
  return (n.intuition ? `<p class="lead">${esc(n.intuition)}</p>` : `<p class="lead">${esc(n.statement)}</p>`) +
    (n.pics || []).map(picHTML).join("") +
    (n.proof ? `<h3>Proof sketch</h3><p>${esc(n.proof)}</p>` : "") +
    (n.evidence ? `<h3>Evidence</h3><p>${esc(n.evidence)}</p>` : "") +
    (outs.length ? `<h3>${n.status === "disproved" ? "Would have proved" : "Proves / would prove"}</h3>${outs.map(e => edgeItem(e, n.id, "out")).join("")}` : "") +
    (ins.length ? `<h3>Follows from / supported by</h3>${ins.map(e => edgeItem(e, n.id, "in")).join("")}` : "") +
    (n.intuition || n.example || n.refs ? `<details><summary>Formal statement and details</summary>` +
      (n.intuition ? `<h3>Statement</h3><p>${esc(n.statement)}</p>` : "") +
      (n.example ? `<h3>Example</h3><pre>${esc(n.example)}</pre>` : "") +
      (n.refs ? `<h3>Source</h3><p class="note">${esc(n.refs)}</p>` : "") + `</details>` : "");
}
function select(id, recenter) {
  if (!pos[id]) { hideDead = false; $("hide").setAttribute("aria-pressed", false); layout(); }
  sel = id; const n = byId[id];
  const chip = `<span class="chip s-${n.status}"><span class="dot"></span>${STATUS[n.status]}</span>` + (n.active ? ` <span class="chip"><span class="dot" style="--c:var(--run)"></span>${esc(n.active)}</span>` : "");
  const tabs = n.vis ? `<div class="tabs"><button class="tab on" data-tab="v">${esc(n.vis.title || "Lab")}</button><button class="tab" data-tab="d">Explanation</button></div>` : "";
  openPanel(!!n.vis, head(chip, n.title, tabs) + `<div class="pbody" id="pbody"></div>`);
  const body = $("pbody");
  const showTab = t => { P.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
    if (t === "v") { body.className = "pbody frame"; body.innerHTML = `<iframe src="${esc(n.vis.file)}" title="${esc(n.vis.title || n.title)}"></iframe>`; }
    else { body.className = "pbody"; body.innerHTML = explain(n); body.scrollTop = 0; } };
  P.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));
  showTab(n.vis ? "v" : "d");
  highlight(id); history.replaceState(null, "", "#n-" + id);
  if (recenter || narrow()) requestAnimationFrame(() => centerOn(id));
}
addEventListener("resize", () => { sizePanel(); if (!sel) fit(); });
}
</script>
</body>
</html>
